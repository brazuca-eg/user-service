spring:
  application:
    name: user-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: 8070

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

beamcard:
  auth:
    access-token-ttl: PT15M
    jwt:
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:.dev-keys/jwt-private.pem}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:.dev-keys/jwt-public.pem}
      #Dev only. Set false in prod so a missing key fails fast.
      generate-if-missing: ${JWT_GENERATE_IF_MISSING:true}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
      reset-url-template: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password?token=%s}
    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
      verify-url-template: ${EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email?token=%s}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:beamcard<test@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}

  cors:
    allowed-origins: http://localhost:5173

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.beamcard.user: DEBUG
    org.flywaydb: INFO
